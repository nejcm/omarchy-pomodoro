name: checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Model unit tests
        run: node Model.test.js

      - name: Release version-bump unit tests
        run: node Release.test.js

      - name: manifest.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
